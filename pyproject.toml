[project]
name = "agentic-commerce-augmentation"
version = "0.1.0"
description = "Empowerment-first contextual commerce platform"
authors = [{ name = "Performics Labs" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.105.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.7.0",
    "google-auth>=2.25.0",
    "google-genai>=0.1.0",
    # Keep local embedding stack compatible with sentence-transformers/transformers.
    "huggingface-hub>=0.34.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.1",
    "pytest>=9.0.0",
    "uvicorn[standard]>=0.23.0",
]

[tool.uv]
managed = true

[tool.ruff]
required-version = "==0.16.1"
respect-gitignore = true
exclude = [
    ".git",
    ".venv",
    "venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".uv-cache",
    ".cache",
    "node_modules",
    "web/node_modules",
    "web/.next",
    "tmp",
    "db",
]

[tool.ruff.lint]
# Keep the pre-0.16 lint contract explicit. Ruff 0.16 expanded its implicit
# defaults substantially; broader rule adoption should happen intentionally.
select = ["E4", "E7", "E9", "F"]
