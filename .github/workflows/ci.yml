name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard legacy DB paths
        run: |
          set -euo pipefail
          if [ -d "db/migrations" ] || [ -f "db/schema.sql" ]; then
            echo "Legacy DB artifacts detected under db/. Use shared/db/* as canonical source."
            exit 1
          fi
          if grep -R -n --exclude-dir=.git --exclude-dir=.venv --include='*.py' --include='.env*' -E 'os\.getenv\("DATABASE_PATH", "\./db/discovery\.db"\)|DATABASE_PATH=\./db/discovery\.db' .; then
            echo "Legacy DATABASE_PATH default './db/discovery.db' detected. Use './tmp/local.db'."
            exit 1
          fi
          if find infrastructure/db -maxdepth 1 -type f -name '*.py' ! -name '__init__.py' | grep -q .; then
            echo "Flat DB adapter modules detected in infrastructure/db/. Use grouped packages (core/agent/experiment/validation/loop/catalog/session/search)."
            find infrastructure/db -maxdepth 1 -type f -name '*.py' ! -name '__init__.py'
            exit 1
          fi
          if grep -R -n --exclude-dir=.git --exclude-dir=.venv --include='*.py' -E 'from infrastructure\.db\.[a-z_]+[[:space:]]+import|import infrastructure\.db\.[a-z_]+([[:space:]]+as[[:space:]]+[A-Za-z_][A-Za-z0-9_]*)?[[:space:]]*$' .; then
            echo "Legacy flat imports detected. Use grouped imports (e.g., infrastructure.db.experiment.experiment_runs)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: make lint
      - name: Architecture Check
        run: make arch-check
      - name: Bloat Check
        run: make bloat-check
      - name: Tests
        env:
          CATALOG_SOURCE: mock
          LLM_PROVIDER: openrouter
          OPENROUTER_API_KEY: test-key
        run: make test
