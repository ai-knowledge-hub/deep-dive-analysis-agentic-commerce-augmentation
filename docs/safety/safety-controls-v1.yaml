    {"id": "CTRL-15", "description": "Tenant quotas, worker pools, queue backpressure, concurrency bulkheads, and isolated workspaces prevent cascading parallel failure.", "kind": "preventive", "status": "planned", "owner": "operations", "target_phase": "Phase 3-4", "constraint_ids": ["SC-06", "SC-07"], "verification_ids": ["VT-15"]},
    {"id": "CTRL-16", "description": "Versioned command receipts and append-only events separate command idempotency from multi-event emission and projection rebuild.", "kind": "preventive", "status": "planned", "owner": "workflow-kernel", "target_phase": "Phase 3", "constraint_ids": ["SC-02", "SC-13"], "verification_ids": ["VT-16"]}
