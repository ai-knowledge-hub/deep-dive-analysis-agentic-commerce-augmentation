  "constraints": [
    {"id": "SC-01", "description": "Every control action is checked against pinned tenant, principal, authority, registry, harness, and policy versions; retrieved content cannot expand them.", "hazard_ids": ["H-01", "H-03", "H-04", "H-09"]},
    {"id": "SC-02", "description": "Plans are immutable revisions and scheduling uses the complete task membership of the active approved revision.", "hazard_ids": ["H-04", "H-08", "H-10"]},
    {"id": "SC-03", "description": "Approval is independent, time bounded, revocable, and bound to the exact payload, effect, evidence, authority, and graph revision.", "hazard_ids": ["H-01", "H-04", "H-08"]},
    {"id": "SC-04", "description": "Only an unexpired attempt lease with the current fencing token may commit a result or effect outcome.", "hazard_ids": ["H-02", "H-04", "H-07", "H-10"]},
    {"id": "SC-05", "description": "Every committed effect has an idempotency key, durable receipt, and reconciliation path before retry or recovery.", "hazard_ids": ["H-01", "H-02", "H-07"]},
    {"id": "SC-06", "description": "Context capsules, results, storage, tools, and messages are least privilege and tenant scoped end to end.", "hazard_ids": ["H-01", "H-03", "H-10"]},
    {"id": "SC-07", "description": "The host atomically reserves non-expanding depth, concurrency, token, cost, time, action, and retry budgets before admitting work.", "hazard_ids": ["H-01", "H-06", "H-07", "H-10"]},
    {"id": "SC-08", "description": "Workers return isolated typed results with provenance; only the coordinator validates and commits shared state.", "hazard_ids": ["H-03", "H-04", "H-05", "H-10"]},
    {"id": "SC-09", "description": "Belief and memory updates require versioned priors, evidence provenance, validation, contradiction handling, and tenant-scoped commit receipts.", "hazard_ids": ["H-03", "H-05", "H-08", "H-09"]},
    {"id": "SC-10", "description": "Prompt variables, retrieved content, tool output, and child reports remain untrusted data and cannot become policy, approval, or configuration instructions.", "hazard_ids": ["H-01", "H-03", "H-05", "H-09"]},
    {"id": "SC-11", "description": "Goal and workflow completion require explicit outcome gates; a child admission, partial result, passed subset gate, or exhausted limit cannot imply success.", "hazard_ids": ["H-07", "H-08", "H-09"]},
    {"id": "SC-12", "description": "Harness refinements are supplemental, versioned, evidence backed, evaluated, approval governed, reversible, and session local by default.", "hazard_ids": ["H-01", "H-03", "H-05", "H-09"]},
    {"id": "SC-13", "description": "Durable feedback exposes event cursor, revision, approval, lease, result, receipt, budget, projection lag, and recovery state.", "hazard_ids": ["H-02", "H-04", "H-07", "H-08"]},
    {"id": "SC-14", "description": "Pause, cancel, revoke, timeout, and compensation propagate to every active worker and external operation with acknowledgement or escalation.", "hazard_ids": ["H-01", "H-02", "H-06", "H-07"]}
  ],
  "controls": [
    {"id": "CTRL-01", "description": "Central executable workflow transition contract with terminal-state invariants.", "kind": "preventive", "status": "implemented", "owner": "agent-runtime", "constraint_ids": ["SC-11"], "verification_ids": ["VT-01"]},
    {"id": "CTRL-02", "description": "Immutable graph revisions, complete revision membership, optimistic commands, and active-revision scheduler checks.", "kind": "preventive", "status": "planned", "owner": "workflow-kernel", "target_phase": "Phase 3", "constraint_ids": ["SC-02"], "verification_ids": ["VT-02"]},
    {"id": "CTRL-03", "description": "Policy preflight and single-use approval receipts use the complete fingerprinted capability contract, including defaults, schemas, and field canonicalizers, to produce one persisted executable payload before approval and hashing; governed execution consumes those frozen values without further transformation; cancellation, current lease, and count-budget availability are atomically revalidated immediately before governed effects; provider and local-effect receipts and audit authority bind to immutable start evidence; frozen auto-run inputs require completed-job and durable-result evidence with an immutable requested model used for execution and result verification while non-auto-run accepts only provenance-bound job creation; legacy starts lacking that evidence remain quarantined; unexpected post-start failures become uncertain outcomes; and a bearer-authorized tenant-scoped command discovers bound durable evidence, reconciles idempotently without reinvoking the effect, restores failed projections, atomically preserves canceled runs, retries projection derivation when cancellation or concurrent replanning races recovery, rejects recovery-action insertion when a stale preflight loses to terminal completion, and allocates recovery-action sequences, retry ordinals, and retry effect identities under that guarded write lock so concurrent valid commands cannot collide, be lost, or share a single-use authorization identity; lab-promotion commits additionally re-resolve the tenant-owned experiment, its variant, and the exact source metric inside the receipt transaction.", "kind": "preventive", "status": "implemented", "constraint_ids": ["SC-01", "SC-03"], "verification_ids": ["VT-03"]},
    {"id": "CTRL-04", "description": "Host-owned delegation admission with atomic authority, depth, concurrency, and multidimensional budget reservations.", "kind": "preventive", "status": "planned", "owner": "workflow-kernel", "target_phase": "Phase 4", "constraint_ids": ["SC-01", "SC-07"], "verification_ids": ["VT-04"]},
    {"id": "CTRL-05", "description": "Tenant-scoped least-privilege context capsules and isolated worker workspaces, credentials, transcripts, and messages.", "kind": "preventive", "status": "planned", "owner": "agent-runtime-security", "target_phase": "Phase 4", "constraint_ids": ["SC-06"], "verification_ids": ["VT-05"]},
    {"id": "CTRL-06", "description": "Attempt leases, heartbeats, compare-and-swap claims, fencing tokens, stale-worker rejection, and independent retry history.", "kind": "preventive", "status": "planned", "owner": "workflow-kernel", "target_phase": "Phase 3", "constraint_ids": ["SC-04"], "verification_ids": ["VT-06"]},
    {"id": "CTRL-07", "description": "Effect idempotency, durable receipts, uncertain-outcome reconciliation, and compensation linkage.", "kind": "preventive", "status": "planned", "owner": "agent-runtime", "target_phase": "Phase 3", "constraint_ids": ["SC-05", "SC-14"], "verification_ids": ["VT-07"]},
    {"id": "CTRL-08", "description": "Typed result schemas, provenance validation, deterministic joins, and coordinator-only shared-state commits.", "kind": "preventive", "status": "planned", "owner": "workflow-kernel", "target_phase": "Phase 4", "constraint_ids": ["SC-08"], "verification_ids": ["VT-08"]},
    {"id": "CTRL-09", "description": "Instruction/data separation and scanning for retrieved context, tool output, child reports, and inter-agent messages.", "kind": "preventive", "status": "planned", "owner": "agent-runtime-security", "target_phase": "Phase 1 threat model and Phase 4", "constraint_ids": ["SC-10"], "verification_ids": ["VT-09"]},
    {"id": "CTRL-10", "description": "Belief and memory candidate validation with prior/evidence versions, provenance, contradiction, calibration, promotion, and rollback checks.", "kind": "preventive", "status": "planned", "owner": "learning-loop", "target_phase": "Phase 2-3", "constraint_ids": ["SC-09"], "verification_ids": ["VT-10"]},
    {"id": "CTRL-11", "description": "Durable goals and completion gates separated from autonomous continuation limits and child progress.", "kind": "preventive", "status": "planned", "owner": "workflow-kernel", "target_phase": "Phase 3", "constraint_ids": ["SC-11"], "verification_ids": ["VT-11"]},
    {"id": "CTRL-12", "description": "Durable heartbeats, schedules, cancellation, timeout, recovery, and worker/external-operation acknowledgements.", "kind": "detective", "status": "planned", "owner": "operations", "target_phase": "Phase 3-4", "constraint_ids": ["SC-13", "SC-14"], "verification_ids": ["VT-12"]},
    {"id": "CTRL-13", "description": "Supplemental harness candidate ledger with immutable base, local-default scope, evidence, eval gate, approval, activation receipt, and rollback.", "kind": "preventive", "status": "planned", "owner": "harness-governance", "target_phase": "Post-beta", "constraint_ids": ["SC-12"], "verification_ids": ["VT-13"]},
