{
  "schema_version": "1.0",
  "analysis_id": "stpa-workflow-control-v1",
  "scope": "plan -> approve -> delegate -> execute -> observe -> update belief or memory, with supplemental harness promotion",
  "losses": [
    {"id": "L-01", "description": "An unauthorized, harmful, or commercially incorrect external or internal effect occurs."},
    {"id": "L-02", "description": "Tenant, customer, credential, or commercially sensitive data is disclosed or corrupted."},
    {"id": "L-03", "description": "Evidence, belief, memory, or harness state becomes untrustworthy and drives later decisions."},
    {"id": "L-04", "description": "Work, money, tokens, time, or service availability is lost through duplicate, runaway, or unrecoverable execution."},
    {"id": "L-05", "description": "An operator cannot understand, stop, recover, or attribute system behaviour."},
    {"id": "L-06", "description": "The platform makes a materially wrong commerce recommendation or optimization decision."}
  ],
  "hazards": [
    {"id": "H-01", "description": "The system can issue or continue an effect outside valid authority, policy, approval, or evidence bounds.", "loss_ids": ["L-01", "L-05", "L-06"]},
    {"id": "H-02", "description": "The system can repeat a committed effect or cannot determine whether an effect committed.", "loss_ids": ["L-01", "L-04", "L-05"]},
    {"id": "H-03", "description": "Data, context, results, credentials, or state cross a tenant or assignment boundary.", "loss_ids": ["L-01", "L-02", "L-03"]},
    {"id": "H-04", "description": "Scheduling or execution uses a stale, invalid, unapproved, or internally inconsistent plan or task state.", "loss_ids": ["L-01", "L-04", "L-06"]},
    {"id": "H-05", "description": "Unvalidated, poisoned, mis-scoped, or contradicted information influences belief, memory, or a later decision.", "loss_ids": ["L-03", "L-06"]},
    {"id": "H-06", "description": "Recursion, parallelism, retries, tools, goals, or background work exceed bounded resources or cannot be stopped.", "loss_ids": ["L-01", "L-04", "L-05"]},
    {"id": "H-07", "description": "Required work or recovery is never started, becomes stranded, or is terminated before a safe outcome.", "loss_ids": ["L-04", "L-05", "L-06"]},
    {"id": "H-08", "description": "Operator and system projections report progress, safety, or completion inconsistently with durable state.", "loss_ids": ["L-05", "L-06"]},
    {"id": "H-09", "description": "Mutable harness or goal state causes uncontrolled behaviour drift, unsafe self-modification, or false completion.", "loss_ids": ["L-01", "L-03", "L-04", "L-06"]},
    {"id": "H-10", "description": "Concurrent workers interfere, oversubscribe shared resources, or commit inconsistent shared state.", "loss_ids": ["L-01", "L-02", "L-03", "L-04"]}
